<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Signal</title>
<meta name="description" content="From brand positioning to launch day, we build the whole picture. Studio Signal is a UK brand and website studio helping purpose-led organisations cut through the digital noise.">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="preconnect" href="https://p.typekit.net" crossorigin>

<link rel="preload" href="assets/logo.svg" as="image" fetchpriority="high">
<style>
  :root {
    --bg: #101010;
    --fg: #FFFCF5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    touch-action: none;
  }

  .hero canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .layout {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "header-left  header-right"
      "spot         spot"
      "footer-left  footer-right";
    padding: 40px;
    pointer-events: none;
  }

  .layout a {
    pointer-events: auto;
    touch-action: manipulation;
  }

  .eyebrow, .nav-link, .enquiries {
    font-family: "zuume", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: normal;
    text-transform: uppercase;
    color: var(--fg);
    text-decoration: none;
  }

  .nav-link, .enquiries a {
    color: var(--fg);
    text-decoration: none;
    transition: color 300ms ease;
  }

  .nav-link:hover {
    color: #C8F3FA;
  }

  .enquiries a {
    color: #C8F3FA;
  }

  .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .nav-link svg {
    flex: none;
  }

  .header-left { grid-area: header-left; justify-self: start; align-self: start; }

  .header-right {
    grid-area: header-right;
    justify-self: end;
    align-self: start;
    text-align: right;
  }

  .footer-left {
    grid-area: footer-left;
    justify-self: start;
    align-self: end;
    display: flex;
    gap: 28px;
  }

  .footer-right {
    grid-area: footer-right;
    justify-self: end;
    align-self: end;
    text-align: right;
    pointer-events: auto;
  }

  .email-wrap {
    position: relative;
    display: inline-block;
  }

  .email-motif {
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%);
    margin-bottom: -2px;
    width: 34px;
    height: auto;
    pointer-events: none;
    opacity: 0;
    transition: opacity 300ms ease;
  }

  .email-wrap:hover .email-motif {
    opacity: 1;
    transition: opacity 100ms ease;
  }

  @media (max-width: 640px) {
    .layout {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto auto auto;
      grid-template-areas:
        "header-left"
        "spot"
        "header-right"
        "footer-right"
        "footer-left";
      padding: 24px;
      row-gap: 1.25rem;
    }

    .header-right,
    .footer-left,
    .footer-right {
      justify-self: start;
      text-align: left;
    }
  }
</style>
</head>
<body>

<section class="hero" id="hero">
  <canvas id="sunCanvas"></canvas>
  <div class="layout">
    <div class="eyebrow header-left">We are Studio Signal</div>
    <div class="eyebrow header-right">Specialist UK brand &amp; web studio</div>
    <div class="footer-left">

      <a class="nav-link" href="#" target="_blank" rel="noopener">LinkedIn<svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6.66665 0L8.86198 2.19533L4.19531 6.862L5.13798 7.80467L9.80465 3.138L12 5.33333V0H6.66665Z" fill="currentColor"/><path d="M10.6667 10.6667H1.33333V1.33333H6L4.66667 0H1.33333C0.598 0 0 0.598 0 1.33333V10.6667C0 11.402 0.598 12 1.33333 12H10.6667C11.402 12 12 11.402 12 10.6667V7.33333L10.6667 6V10.6667Z" fill="currentColor"/></svg></a>
    </div>
    <div class="enquiries footer-right">
      Enquiries: <span class="email-wrap"><svg class="email-motif" width="50" height="29" viewBox="0 0 50 29" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M24.2636 24.5943L2.20656 14.2852L4.13301 10.9684L24.2636 24.5943Z" fill="#FFD16B"/>
        <path d="M24.2652 24.5951L7.07787 7.48902L10.0397 5.02565L24.2652 24.5951Z" fill="#FFD16B"/>
        <path d="M24.2632 24.595L14.0167 2.75554L17.6617 1.44547L24.2632 24.595Z" fill="#FFD16B"/>
        <path d="M24.2648 24.5941L22.1955 0.655979L26.0808 0.654614L24.2648 24.5941Z" fill="#FFD16B"/>
        <path d="M24.2656 24.5945L30.6231 1.44331L34.2807 2.75389L24.2656 24.5945Z" fill="#FFD16B"/>
        <path d="M24.2674 24.5945L38.2859 5.02406L41.2742 7.48547L24.2674 24.5945Z" fill="#FFD16B"/>
        <path d="M24.2665 24.5957L44.2545 10.9647L46.2151 14.2824L24.2665 24.5957Z" fill="#FFD16B"/>
        <path d="M24.265 24.5942L47.8119 18.5495L48.5059 22.321L24.265 24.5942Z" fill="#FFD16B"/>
        <path d="M24.2645 24.5962L0.654002 18.5554L-0.000678913 22.3272L24.2645 24.5962Z" fill="#FFD16B"/>
      </svg><a href="mailto:hi@studiosignal.co.uk">hi@studiosignal.co.uk</a></span>
    </div>
  </div>
</section>

<script>
(function () {
  const hero = document.getElementById('hero');
  const canvas = document.getElementById('sunCanvas');
  const ctx = canvas.getContext('2d');

  // --- config ---------------------------------------------------------
  const LOGO_WIDTH_RATIO = 1.1;      // logo layer fills 110% of the hero width on desktop
  const LOGO_INSET_MOBILE = 10;        // px — gap from each viewport edge on mobile
  const MOBILE_BREAKPOINT = 640;     // px
  const LOGO_MAX_WIDTH = 800;         // px — cap on the logo layer's width
  const MAX_OPACITY = 1;             // opacity at the centre of the beam
  const REVEAL_RADIUS_MIN = 170;     // px — searchlight floor on desktop-width viewports
  const REVEAL_RADIUS_MAX = 340;     // px — searchlight size ceiling, on wide desktop viewports
  const REVEAL_RADIUS_VW = 0.18;     // preferred size as a share of the hero's width, like clamp()'s middle arg
  const REVEAL_RADIUS_VW_MOBILE = 0.28; // mobile scales with viewport — avoids the desktop min blowing up the beam
  const REVEAL_RADIUS_MIN_MOBILE = 88;
  const REVEAL_RADIUS_MAX_MOBILE = 200;
  const REVEAL_CORE_FRACTION = 0.14; // share of radius that stays fully opaque before falloff
  const POINTER_EASE = 0.14;         // 0..1, how quickly the glow follows the mouse/finger
  const GROWTH_ON_MOVE = 0.15;       // spotlight grows up to 15% while actively moving
  const SPEED_FOR_MAX_GROWTH = 35;   // px/move-event needed to hit full growth
  const GRADIENT_STOPS = 16;         // samples along the spotlight's falloff curve — higher = smoother
  const ROAM_MARGIN = 0.14;          // auto-search stays within this margin of the edges
  const ROAM_DWELL_MIN = 2200;       // ms examining one area before moving on
  const ROAM_DWELL_MAX = 3800;
  const ROAM_TRAVEL_MIN = 2000;      // ms gliding to the next area
  const ROAM_TRAVEL_MAX = 3200;
  const ROAM_TREMOR = 3.5;           // px — constant hand-shake on the beam
  const ROAM_SEARCH_RADIUS = 28;     // px — slow sweep while dwelling
  const ROAM_TRAVEL_SWAY = 22;       // px — lateral sweep while travelling
  const ROAM_TRAVEL_TREMOR = 6;      // extra shake while moving between spots
  const POINTER_EASE_ROAM_DWELL = 0.11;
  const POINTER_EASE_ROAM_TRAVEL = 0.24;
  const isTouchDevice = matchMedia('(hover: none)').matches; // no cursor to follow — search automatically instead
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let width = 0, height = 0;
  let centerX = 0, centerY = 0;
  let logoLayer = null; // offscreen canvas holding the oversized, static logo mark

  const bgLogoImg = new Image();
  let bgLogoLoaded = false;
  bgLogoImg.onload = () => { bgLogoLoaded = true; buildLogoLayer(); };
  bgLogoImg.src = 'assets/logo.svg';

  // target = raw pointer position, current = eased position the render loop follows
  let targetX = null, targetY = null;
  let currentX = null, currentY = null;
  let pointerActive = false;
  let fadeOut = 0; // 1 = fully visible glow, 0 = pointer has left
  let revealAlpha = 0; // eased reveal strength, follows fadeOut
  let moveSpeed = 0; // decays each frame, spikes on pointer movement
  let radiusScale = 1; // eased 1..1+GROWTH_ON_MOVE, driven by moveSpeed
  let revealRadius = REVEAL_RADIUS_MIN; // clamp(MIN, width * VW, MAX), recalculated on resize
  let isUserTouching = false; // a finger is currently down — pause auto-search and follow it directly
  let roamPhase = 'dwell'; // dwell | travel
  let roamPhaseStart = 0;
  let roamPhaseDuration = 0;
  let roamAnchorX = 0;
  let roamAnchorY = 0;
  let roamTravelFromX = 0;
  let roamTravelFromY = 0;
  let roamNextX = 0;
  let roamNextY = 0;

  function resize() {
    const rect = hero.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    centerX = width / 2;
    centerY = height / 2;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    revealRadius = computeRevealRadius(width);
    buildLogoLayer();
  }

  function computeRevealRadius(w) {
    if (w < MOBILE_BREAKPOINT) {
      return Math.min(
        REVEAL_RADIUS_MAX_MOBILE,
        Math.max(REVEAL_RADIUS_MIN_MOBILE, w * REVEAL_RADIUS_VW_MOBILE)
      );
    }
    return Math.min(REVEAL_RADIUS_MAX, Math.max(REVEAL_RADIUS_MIN, w * REVEAL_RADIUS_VW));
  }

  function buildLogoLayer() {
    if (!bgLogoLoaded || !width || !height) return;

    logoLayer = document.createElement('canvas');
    logoLayer.width = canvas.width;
    logoLayer.height = canvas.height;
    const lctx = logoLayer.getContext('2d');
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const isMobileLayout = width < MOBILE_BREAKPOINT;
    const logoW = isMobileLayout
      ? Math.min(Math.max(0, width - LOGO_INSET_MOBILE * 2), LOGO_MAX_WIDTH)
      : Math.min(width * LOGO_WIDTH_RATIO, LOGO_MAX_WIDTH);
    const logoH = logoW * (bgLogoImg.naturalHeight / bgLogoImg.naturalWidth);
    lctx.drawImage(bgLogoImg, centerX - logoW / 2, centerY - logoH / 2, logoW, logoH);
  }

  function render() {
    ctx.clearRect(0, 0, width, height);

    if (isTouchDevice && !isUserTouching && width) {
      updateRoam(performance.now());
    }

    let pointerEase = POINTER_EASE;
    if (isUserTouching) {
      pointerEase = 0.32;
    } else if (isTouchDevice) {
      pointerEase = roamPhase === 'travel' ? POINTER_EASE_ROAM_TRAVEL : POINTER_EASE_ROAM_DWELL;
    }

    // ease the glow position toward the pointer for a gentle trailing feel
    if (targetX !== null) {
      if (currentX === null) { currentX = targetX; currentY = targetY; }
      currentX += (targetX - currentX) * pointerEase;
      currentY += (targetY - currentY) * pointerEase;
    }

    // fade the whole glow in/out as the pointer enters/leaves the hero
    const fadeTarget = pointerActive ? 1 : 0;
    fadeOut += (fadeTarget - fadeOut) * 0.09;
    revealAlpha += (fadeOut - revealAlpha) * 0.18;

    // grow the spotlight while actively moving, shrink back when it settles
    moveSpeed *= 0.85;
    const growthTarget = 1 + GROWTH_ON_MOVE * Math.min(1, moveSpeed / SPEED_FOR_MAX_GROWTH);
    radiusScale += (growthTarget - radiusScale) * 0.15;

    if (currentX !== null && revealAlpha > 0.002 && logoLayer) {
      ctx.save();
      ctx.globalAlpha = MAX_OPACITY * revealAlpha;
      ctx.drawImage(logoLayer, 0, 0, width, height);

      // soft-edged circular spotlight mask
      ctx.globalCompositeOperation = 'destination-in';
      const grad = ctx.createRadialGradient(currentX, currentY, 0, currentX, currentY, revealRadius * radiusScale);
      // sample a smooth cosine falloff (1 -> 0, easing at both ends) instead of a few
      // hand-picked stops, which read as visible rings where the slope kinked
      for (let i = 0; i <= GRADIENT_STOPS; i++) {
        const t = i / GRADIENT_STOPS;
        let alpha;
        if (t <= REVEAL_CORE_FRACTION) {
          alpha = 1;
        } else {
          const u = (t - REVEAL_CORE_FRACTION) / (1 - REVEAL_CORE_FRACTION);
          alpha = 0.5 * (1 + Math.cos(Math.PI * u));
        }
        grad.addColorStop(t, `rgba(255,255,255,${alpha})`);
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);
      ctx.restore();
    }

    requestAnimationFrame(render);
  }

  function updateTarget(newX, newY, opts) {
    const trackSpeed = !opts || opts.trackSpeed !== false;
    if (trackSpeed && targetX !== null) {
      const dx = newX - targetX;
      const dy = newY - targetY;
      moveSpeed = Math.max(moveSpeed, Math.sqrt(dx * dx + dy * dy));
    }
    targetX = newX;
    targetY = newY;
    pointerActive = true;
  }

  function handlePointerMove(e) {
    const rect = hero.getBoundingClientRect();
    updateTarget(e.clientX - rect.left, e.clientY - rect.top);
  }

  function handlePointerLeave() {
    pointerActive = false;
  }

  function isInteractiveTouchTarget(e) {
    const el = e.target instanceof Element ? e.target.closest('a') : null;
    return el !== null && hero.contains(el);
  }

  function applyTouchPoint(e) {
    if (!e.touches || !e.touches[0]) return;
    isUserTouching = true;
    const rect = hero.getBoundingClientRect();
    updateTarget(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
  }

  function handleTouchStart(e) {
    if (isInteractiveTouchTarget(e)) return;
    applyTouchPoint(e);
  }

  function handleTouchMove(e) {
    if (isInteractiveTouchTarget(e)) return;
    e.preventDefault();
    applyTouchPoint(e);
  }

  function handleTouchEnd() {
    isUserTouching = false;
    if (isTouchDevice) {
      resumeRoam();
    } else {
      pointerActive = false;
    }
  }

  // --- auto-search (touch devices only) --------------------------------
  // there's no cursor to reveal the logo on mobile, so wander the spotlight
  // around the screen on its own; a real touch always takes priority.
  function pickRoamPoint() {
    return {
      x: width * (ROAM_MARGIN + Math.random() * (1 - ROAM_MARGIN * 2)),
      y: height * (ROAM_MARGIN + Math.random() * (1 - ROAM_MARGIN * 2)),
    };
  }

  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function roamTremor(t, amp) {
    return {
      x: Math.sin(t * 2.17) * amp + Math.sin(t * 5.31) * amp * 0.45 + Math.sin(t * 8.02) * amp * 0.2,
      y: Math.cos(t * 1.83) * amp + Math.cos(t * 4.77) * amp * 0.45 + Math.cos(t * 7.41) * amp * 0.2,
    };
  }

  function startRoamDwell() {
    roamPhase = 'dwell';
    roamPhaseStart = performance.now();
    roamPhaseDuration = ROAM_DWELL_MIN + Math.random() * (ROAM_DWELL_MAX - ROAM_DWELL_MIN);
    roamAnchorX = currentX ?? roamAnchorX;
    roamAnchorY = currentY ?? roamAnchorY;
  }

  function startRoamTravel() {
    roamPhase = 'travel';
    roamPhaseStart = performance.now();
    roamPhaseDuration = ROAM_TRAVEL_MIN + Math.random() * (ROAM_TRAVEL_MAX - ROAM_TRAVEL_MIN);
    roamTravelFromX = currentX ?? roamAnchorX;
    roamTravelFromY = currentY ?? roamAnchorY;
    const next = pickRoamPoint();
    roamNextX = next.x;
    roamNextY = next.y;
  }

  function initRoam() {
    const start = pickRoamPoint();
    roamAnchorX = start.x;
    roamAnchorY = start.y;
    targetX = start.x;
    targetY = start.y;
    currentX = start.x;
    currentY = start.y;
    pointerActive = true;
    startRoamDwell();
  }

  function resumeRoam() {
    roamAnchorX = currentX ?? roamAnchorX;
    roamAnchorY = currentY ?? roamAnchorY;
    startRoamDwell();
  }

  function updateRoam(now) {
    const t = now / 1000;
    const elapsed = now - roamPhaseStart;
    const tremor = roamTremor(t, ROAM_TREMOR);

    if (roamPhase === 'dwell') {
      if (elapsed >= roamPhaseDuration) {
        startRoamTravel();
        return updateRoam(now);
      }

      const phase = t * 0.32;
      const r = ROAM_SEARCH_RADIUS * (0.6 + 0.4 * Math.sin(t * 0.18));
      const searchX = roamAnchorX + Math.cos(phase) * r + Math.sin(phase * 1.6) * r * 0.22;
      const searchY = roamAnchorY + Math.sin(phase * 0.82) * r * 0.88;
      updateTarget(searchX + tremor.x, searchY + tremor.y, { trackSpeed: false });
      return;
    }

    const prog = Math.min(1, elapsed / roamPhaseDuration);
    const eased = easeInOutCubic(prog);
    const baseX = roamTravelFromX + (roamNextX - roamTravelFromX) * eased;
    const baseY = roamTravelFromY + (roamNextY - roamTravelFromY) * eased;

    const dx = roamNextX - roamTravelFromX;
    const dy = roamNextY - roamTravelFromY;
    const len = Math.hypot(dx, dy) || 1;
    const perpX = -dy / len;
    const perpY = dx / len;
    const sway = Math.sin(prog * Math.PI * 2.2) * ROAM_TRAVEL_SWAY * (0.35 + 0.65 * Math.sin(prog * Math.PI));
    const travelShake = roamTremor(t * 1.25, ROAM_TREMOR + ROAM_TRAVEL_TREMOR * Math.sin(prog * Math.PI));

    updateTarget(
      baseX + perpX * sway + travelShake.x,
      baseY + perpY * sway + travelShake.y
    );

    if (prog >= 1) {
      roamAnchorX = roamNextX;
      roamAnchorY = roamNextY;
      startRoamDwell();
    }
  }

  window.addEventListener('resize', resize);
  hero.addEventListener('mousemove', handlePointerMove);
  hero.addEventListener('mouseleave', handlePointerLeave);
  // touchstart reveals immediately on tap/hold, not just once the finger starts dragging
  hero.addEventListener('touchstart', handleTouchStart, { passive: true });
  hero.addEventListener('touchmove', handleTouchMove, { passive: false });
  hero.addEventListener('touchend', handleTouchEnd);
  hero.addEventListener('touchcancel', handleTouchEnd);

  resize();
  requestAnimationFrame(render);
  if (isTouchDevice) initRoam();
})();
</script>

</body>
</html>
