<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Signal</title>

<style>
  :root {
    --bg: #101010;
    --fg: #FFFCF5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    touch-action: none;
  }

  .hero canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .layout {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "header-left  header-right"
      "spot         spot"
      "footer-left  footer-right";
    padding: 40px;
    pointer-events: none;
  }

  .layout a {
    pointer-events: auto;
    touch-action: manipulation;
  }

  .eyebrow, .nav-link, .enquiries {
    font-family: "zuume", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: normal;
    text-transform: uppercase;
    color: var(--fg);
    text-decoration: none;
  }

  .nav-link, .enquiries a {
    color: var(--fg);
    text-decoration: none;
    transition: color 300ms ease;
  }

  .nav-link:hover {
    color: #C8F3FA;
  }

  .enquiries a {
    color: #C8F3FA;
  }

  .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .nav-link svg {
    flex: none;
  }

  .header-left { grid-area: header-left; justify-self: start; align-self: start; }

  .header-right {
    grid-area: header-right;
    justify-self: end;
    align-self: start;
    text-align: right;
  }

  .footer-left {
    grid-area: footer-left;
    justify-self: start;
    align-self: end;
    display: flex;
    gap: 28px;
  }

  .footer-right {
    grid-area: footer-right;
    justify-self: end;
    align-self: end;
    text-align: right;
    pointer-events: auto;
  }

  .email-wrap {
    position: relative;
    display: inline-block;
  }

  .email-motif {
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%);
    margin-bottom: -2px;
    width: 34px;
    height: auto;
    pointer-events: none;
    opacity: 0;
    transition: opacity 300ms ease;
  }

  .email-wrap:hover .email-motif {
    opacity: 1;
    transition: opacity 100ms ease;
  }

  @media (max-width: 640px) {
    .layout {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto auto auto;
      grid-template-areas:
        "header-left"
        "spot"
        "header-right"
        "footer-right"
        "footer-left";
      padding: 24px;
      row-gap: 1.25rem;
    }

    .header-right,
    .footer-left,
    .footer-right {
      justify-self: start;
      text-align: left;
    }
  }
</style>
</head>
<body>

<section class="hero" id="hero">
  <canvas id="sunCanvas"></canvas>
  <div class="layout">
    <div class="eyebrow header-left">We are Studio Signal</div>
    <div class="eyebrow header-right">Specialist UK brand &amp; web studio</div>
    <div class="footer-left">

    <div class="enquiries footer-right">
      Enquiries: <span class="email-wrap"><svg class="email-motif" width="50" height="29" viewBox="0 0 50 29" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M24.2636 24.5943L2.20656 14.2852L4.13301 10.9684L24.2636 24.5943Z" fill="#FFD16B"/>
        <path d="M24.2652 24.5951L7.07787 7.48902L10.0397 5.02565L24.2652 24.5951Z" fill="#FFD16B"/>
        <path d="M24.2632 24.595L14.0167 2.75554L17.6617 1.44547L24.2632 24.595Z" fill="#FFD16B"/>
        <path d="M24.2648 24.5941L22.1955 0.655979L26.0808 0.654614L24.2648 24.5941Z" fill="#FFD16B"/>
        <path d="M24.2656 24.5945L30.6231 1.44331L34.2807 2.75389L24.2656 24.5945Z" fill="#FFD16B"/>
        <path d="M24.2674 24.5945L38.2859 5.02406L41.2742 7.48547L24.2674 24.5945Z" fill="#FFD16B"/>
        <path d="M24.2665 24.5957L44.2545 10.9647L46.2151 14.2824L24.2665 24.5957Z" fill="#FFD16B"/>

      </svg><a href="mailto:hi@studiosignal.co.uk">hi@studiosignal.co.uk</a></span>
    </div>
  </div>
</section>

<script>
(function () {
  const hero = document.getElementById('hero');
  const canvas = document.getElementById('sunCanvas');
  const ctx = canvas.getContext('2d');

  // --- config ---------------------------------------------------------
  const LOGO_WIDTH_RATIO = 1.1;      // logo layer fills 110% of the hero width on desktop
  const LOGO_INSET_MOBILE = 10;        // px — gap from each viewport edge on mobile
  const MOBILE_BREAKPOINT = 640;     // px
  const LOGO_MAX_WIDTH = 800;         // px — cap on the logo layer's width
  const MAX_OPACITY = 1;             // opacity at the centre of the beam
  const REVEAL_RADIUS_MIN = 170;     // px — searchlight floor on desktop-width viewports
  const REVEAL_RADIUS_MAX = 340;     // px — searchlight size ceiling, on wide desktop viewports
  const REVEAL_RADIUS_VW = 0.18;     // preferred size as a share of the hero's width, like clamp()'s middle arg
  const REVEAL_RADIUS_VW_MOBILE = 0.28; // mobile scales with viewport — avoids the desktop min blowing up the beam
  const REVEAL_RADIUS_MIN_MOBILE = 88;
  const REVEAL_RADIUS_MAX_MOBILE = 200;
  const REVEAL_CORE_FRACTION = 0.14; // share of radius that stays fully opaque before falloff
  const POINTER_EASE = 0.14;         // 0..1, how quickly the glow follows the mouse/finger
  const GROWTH_ON_MOVE = 0.15;       // spotlight grows up to 15% while actively moving
  const SPEED_FOR_MAX_GROWTH = 35;   // px/move-event needed to hit full growth
  const GRADIENT_STOPS = 16;         // samples along the spotlight's falloff curve — higher = smoother
  const MOTION_MARGIN = 0.12;        // keep the beam off the viewport edges
  const MOTION_GAMMA_RANGE = 28;     // degrees of left/right tilt for full horizontal travel
  const MOTION_BETA_RANGE = 22;      // degrees of forward/back tilt for full vertical travel
  const POINTER_EASE_MOTION = 0.2;   // how quickly the beam follows tilt
  const isTouchDevice = matchMedia('(hover: none)').matches; // mobile: centre beam + device tilt
  const isIosDevice = (() => {
    if (typeof navigator === 'undefined') return false;
    const ua = navigator.userAgent || '';
    return /iPad|iPhone|iPod/i.test(ua)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  })();
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let width = 0, height = 0;
  let centerX = 0, centerY = 0;
  let logoLayer = null; // offscreen canvas holding the oversized, static logo mark

  const bgLogoImg = new Image();
  let bgLogoLoaded = false;
  bgLogoImg.onload = () => { bgLogoLoaded = true; buildLogoLayer(); };
  bgLogoImg.src = 'assets/logo.svg';

  // target = raw pointer position, current = eased position the render loop follows
  let targetX = null, targetY = null;
  let currentX = null, currentY = null;
  let pointerActive = false;
  let fadeOut = 0; // 1 = fully visible glow, 0 = pointer has left
  let revealAlpha = 0; // eased reveal strength, follows fadeOut
  let moveSpeed = 0; // decays each frame, spikes on pointer movement
  let radiusScale = 1; // eased 1..1+GROWTH_ON_MOVE, driven by moveSpeed
  let revealRadius = REVEAL_RADIUS_MIN; // clamp(MIN, width * VW, MAX), recalculated on resize
  let motionEnabled = false;
  let motionBaseline = null; // gamma/beta when calibrated — spotlight rests at screen centre

  function resize() {
    const rect = hero.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    centerX = width / 2;
    centerY = height / 2;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    revealRadius = computeRevealRadius(width);
    buildLogoLayer();
    if (isTouchDevice && !motionEnabled) {
      initMobileSpotlight();
    }
  }

  function computeRevealRadius(w) {
    if (w < MOBILE_BREAKPOINT) {
      return Math.min(
        REVEAL_RADIUS_MAX_MOBILE,
        Math.max(REVEAL_RADIUS_MIN_MOBILE, w * REVEAL_RADIUS_VW_MOBILE)
      );
    }
    return Math.min(REVEAL_RADIUS_MAX, Math.max(REVEAL_RADIUS_MIN, w * REVEAL_RADIUS_VW));
  }

  function buildLogoLayer() {
    if (!bgLogoLoaded || !width || !height) return;

    logoLayer = document.createElement('canvas');
    logoLayer.width = canvas.width;
    logoLayer.height = canvas.height;
    const lctx = logoLayer.getContext('2d');
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const isMobileLayout = width < MOBILE_BREAKPOINT;
    const logoW = isMobileLayout
      ? Math.min(Math.max(0, width - LOGO_INSET_MOBILE * 2), LOGO_MAX_WIDTH)
      : Math.min(width * LOGO_WIDTH_RATIO, LOGO_MAX_WIDTH);
    const logoH = logoW * (bgLogoImg.naturalHeight / bgLogoImg.naturalWidth);
    lctx.drawImage(bgLogoImg, centerX - logoW / 2, centerY - logoH / 2, logoW, logoH);
  }

  function render() {
    ctx.clearRect(0, 0, width, height);

    const pointerEase = isTouchDevice ? POINTER_EASE_MOTION : POINTER_EASE;

    // ease the glow position toward the pointer for a gentle trailing feel
    if (targetX !== null) {
      if (currentX === null) { currentX = targetX; currentY = targetY; }
      currentX += (targetX - currentX) * pointerEase;
      currentY += (targetY - currentY) * pointerEase;
    }

    // fade the whole glow in/out as the pointer enters/leaves the hero
    const fadeTarget = pointerActive ? 1 : 0;
    fadeOut += (fadeTarget - fadeOut) * 0.09;
    revealAlpha += (fadeOut - revealAlpha) * 0.18;

    // grow the spotlight while actively moving, shrink back when it settles
    moveSpeed *= 0.85;
    const growthTarget = 1 + GROWTH_ON_MOVE * Math.min(1, moveSpeed / SPEED_FOR_MAX_GROWTH);
    radiusScale += (growthTarget - radiusScale) * 0.15;

    if (currentX !== null && revealAlpha > 0.002 && logoLayer) {
      ctx.save();
      ctx.globalAlpha = MAX_OPACITY * revealAlpha;
      ctx.drawImage(logoLayer, 0, 0, width, height);

      // soft-edged circular spotlight mask
      ctx.globalCompositeOperation = 'destination-in';
      const grad = ctx.createRadialGradient(currentX, currentY, 0, currentX, currentY, revealRadius * radiusScale);
      // sample a smooth cosine falloff (1 -> 0, easing at both ends) instead of a few
      // hand-picked stops, which read as visible rings where the slope kinked
      for (let i = 0; i <= GRADIENT_STOPS; i++) {
        const t = i / GRADIENT_STOPS;
        let alpha;
        if (t <= REVEAL_CORE_FRACTION) {
          alpha = 1;
        } else {
          const u = (t - REVEAL_CORE_FRACTION) / (1 - REVEAL_CORE_FRACTION);
          alpha = 0.5 * (1 + Math.cos(Math.PI * u));
        }
        grad.addColorStop(t, `rgba(255,255,255,${alpha})`);
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);
      ctx.restore();
    }

    requestAnimationFrame(render);
  }

  function updateTarget(newX, newY, opts) {
    const trackSpeed = !opts || opts.trackSpeed !== false;
    if (trackSpeed && targetX !== null) {
      const dx = newX - targetX;
      const dy = newY - targetY;
      moveSpeed = Math.max(moveSpeed, Math.sqrt(dx * dx + dy * dy));
    }
    targetX = newX;
    targetY = newY;
    pointerActive = true;
  }

  function handlePointerMove(e) {
    const rect = hero.getBoundingClientRect();
    updateTarget(e.clientX - rect.left, e.clientY - rect.top);
  }

  function handlePointerLeave() {
    pointerActive = false;
  }

  function isInteractiveTouchTarget(e) {
    const el = e.target instanceof Element ? e.target.closest('a') : null;
    return el !== null && hero.contains(el);
  }

  function handleMotionUserGesture() {
    if (isTouchDevice && !motionEnabled) {
      enableDeviceMotion();
    }
  }

  function handleTouchStart(e) {
    handleMotionUserGesture();
    if (isInteractiveTouchTarget(e)) return;
  }

  function handleTouchMove(e) {
    if (isInteractiveTouchTarget(e)) return;
    e.preventDefault();
  }

  function handleTouchEnd() {
    if (!isTouchDevice) {
      pointerActive = false;
    }
  }

  function initMobileSpotlight() {
    if (!width || !height) return;
    targetX = centerX;
    targetY = centerY;
    currentX = centerX;
    currentY = centerY;
    pointerActive = true;
    fadeOut = 1;
    revealAlpha = 1;
  }

  function clampSpotlight(x, y) {
    const edgeX = width * MOTION_MARGIN;
    const edgeY = height * MOTION_MARGIN;
    return {
      x: Math.min(width - edgeX, Math.max(edgeX, x)),
      y: Math.min(height - edgeY, Math.max(edgeY, y)),
    };
  }

  function applyMotionTilt(gamma, beta) {
    if (!width || !height) return;

    if (motionBaseline === null) {
      motionBaseline = { gamma, beta };
    }

    const dGamma = gamma - motionBaseline.gamma;
    const dBeta = beta - motionBaseline.beta;
    const maxDx = width * (0.5 - MOTION_MARGIN);
    const maxDy = height * (0.5 - MOTION_MARGIN);
    const rawX = centerX + (dGamma / MOTION_GAMMA_RANGE) * maxDx;
    const rawY = centerY + (dBeta / MOTION_BETA_RANGE) * maxDy;
    const point = clampSpotlight(rawX, rawY);
    updateTarget(point.x, point.y);
  }

  let motionFromGravity = false;

  function tiltFromGravity(x, y, z) {
    const beta = Math.atan2(-z, Math.sqrt(x * x + y * y)) * (180 / Math.PI);
    const gamma = Math.atan2(x, y) * (180 / Math.PI);
    return { gamma, beta };
  }

  function handleDeviceOrientation(e) {
    if (!motionEnabled || motionFromGravity) return;
    if (e.gamma == null || e.beta == null) return;
    applyMotionTilt(e.gamma, e.beta);
  }

  function handleDeviceMotion(e) {
    if (!motionEnabled) return;
    const g = e.accelerationIncludingGravity;
    if (!g || g.x == null || g.y == null || g.z == null) return;
    const { gamma, beta } = tiltFromGravity(g.x, g.y, g.z);
    motionFromGravity = true;
    applyMotionTilt(gamma, beta);
  }

  function motionRequiresUserGesture() {
    if (isIosDevice) return true;
    return (typeof DeviceOrientationEvent !== 'undefined'
      && typeof DeviceOrientationEvent.requestPermission === 'function')
      || (typeof DeviceMotionEvent !== 'undefined'
      && typeof DeviceMotionEvent.requestPermission === 'function');
  }

  function requestMotionPermissions() {
    let permissionPromise = Promise.resolve('granted');

    if (typeof DeviceOrientationEvent !== 'undefined'
      && typeof DeviceOrientationEvent.requestPermission === 'function') {
      permissionPromise = DeviceOrientationEvent.requestPermission();
    } else if (typeof DeviceMotionEvent !== 'undefined'
      && typeof DeviceMotionEvent.requestPermission === 'function') {
      permissionPromise = DeviceMotionEvent.requestPermission();
    }

    return permissionPromise
      .then((state) => {
        if (state !== 'granted') return false;
        if (typeof DeviceMotionEvent !== 'undefined'
          && typeof DeviceMotionEvent.requestPermission === 'function'
          && typeof DeviceOrientationEvent !== 'undefined'
          && typeof DeviceOrientationEvent.requestPermission === 'function') {
          return DeviceMotionEvent.requestPermission()
            .then((motionState) => motionState === 'granted' || motionState === 'denied')
            .catch(() => true);
        }
        return true;
      })
      .catch(() => false);
  }

  function startMotionListeners() {
    window.addEventListener('deviceorientation', handleDeviceOrientation, true);
    if (isIosDevice) {
      window.addEventListener('devicemotion', handleDeviceMotion, true);
    }
    motionEnabled = true;
    motionBaseline = null;
    motionFromGravity = false;
    initMobileSpotlight();
  }

  function enableDeviceMotion() {
    if (motionEnabled) return;

    if (motionRequiresUserGesture()) {
      requestMotionPermissions().then((granted) => {
        if (granted) startMotionListeners();
      });
      return;
    }

    startMotionListeners();
  }

  window.addEventListener('resize', resize);
  hero.addEventListener('mousemove', handlePointerMove);
  hero.addEventListener('mouseleave', handlePointerLeave);
  // touchstart reveals immediately on tap/hold, not just once the finger starts dragging
  hero.addEventListener('touchstart', handleTouchStart, { passive: true });
  hero.addEventListener('pointerdown', handleMotionUserGesture, { passive: true });
  hero.addEventListener('touchmove', handleTouchMove, { passive: false });
  hero.addEventListener('touchend', handleTouchEnd);
  hero.addEventListener('touchcancel', handleTouchEnd);

  resize();
  requestAnimationFrame(render);
  if (isTouchDevice) {
    initMobileSpotlight();
    if (!motionRequiresUserGesture()) {
      enableDeviceMotion();
    }
  }
})();
</script>

</body>
</html>
