<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Signal</title>
<meta name="description" content="From brand positioning to launch day, we build the whole picture. Studio Signal is a UK brand and website studio helping purpose-led organisations cut through the digital noise.">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="preconnect" href="https://p.typekit.net" crossorigin>

<link rel="preload" href="assets/logo.svg" as="image" fetchpriority="high">
<style>
  :root {
    --bg: #101010;
    --fg: #FFFCF5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    touch-action: none;
  }

  .hero canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .layout {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "header-left  header-right"
      "spot         spot"
      "footer-left  footer-right";
    padding: 40px;
    pointer-events: none;
  }

  .layout a {
    pointer-events: auto;
    touch-action: manipulation;
  }

  .eyebrow, .nav-link, .enquiries {
    font-family: "zuume", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: normal;
    text-transform: uppercase;
    color: var(--fg);
    text-decoration: none;
  }

  .nav-link, .enquiries a {
    color: var(--fg);
    text-decoration: none;
    transition: color 300ms ease;
  }

  .nav-link:hover {
    color: #C8F3FA;
  }

  .enquiries a {
    color: #C8F3FA;
  }

  .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .nav-link svg {
    flex: none;
  }

  .header-left { grid-area: header-left; justify-self: start; align-self: start; }

  .header-right {
    grid-area: header-right;
    justify-self: end;
    align-self: start;
    text-align: right;
  }

  .footer-left {
    grid-area: footer-left;
    justify-self: start;
    align-self: end;
    display: flex;
    gap: 28px;
  }

  .footer-right {
    grid-area: footer-right;
    justify-self: end;
    align-self: end;
    text-align: right;
    pointer-events: auto;
  }

  .email-wrap {
    position: relative;
    display: inline-block;
  }

  .email-motif {
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%);
    margin-bottom: -2px;
    width: 34px;
    height: auto;
    pointer-events: none;
    opacity: 0;
    transition: opacity 300ms ease;
  }

  .email-wrap:hover .email-motif {
    opacity: 1;
    transition: opacity 100ms ease;
  }

  @media (max-width: 640px) {
    .layout {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto auto auto;
      grid-template-areas:
        "header-left"
        "spot"
        "header-right"
        "footer-right"
        "footer-left";
      padding: 24px;
      row-gap: 1.25rem;
    }

    .header-right,
    .footer-left,
    .footer-right {
      justify-self: start;
      text-align: left;
    }
  }

  .motion-prompt {
    position: absolute;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    z-index: 3;
    width: min(92vw, 22rem);
    pointer-events: auto;
    text-align: center;
  }

  .motion-prompt[hidden] {
    display: none;
  }

  .motion-prompt__btn {
    width: 100%;
    margin: 0;
    padding: 14px 18px;
    border: 1px solid var(--fg);
    border-radius: 999px;
    background: rgba(16, 16, 16, 0.82);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--fg);
    font-family: "zuume", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .motion-prompt__btn:disabled {
    opacity: 0.55;
    cursor: wait;
  }
</style>
</head>
<body>

<script>
(function () {
  const hero = document.getElementById('hero');
  const canvas = document.getElementById('sunCanvas');
  const ctx = canvas.getContext('2d');
  const motionPrompt = document.getElementById('motionPrompt');
  const motionPromptBtn = document.getElementById('motionPromptBtn');

  // --- config ---------------------------------------------------------
  const LOGO_WIDTH_RATIO = 1.1;      // logo layer fills 110% of the hero width on desktop
  const LOGO_INSET_MOBILE = 10;        // px — gap from each viewport edge on mobile
  const MOBILE_BREAKPOINT = 640;     // px
  const LOGO_MAX_WIDTH = 800;         // px — cap on the logo layer's width
  const MAX_OPACITY = 1;             // opacity at the centre of the beam
  const REVEAL_RADIUS_MIN = 170;     // px — searchlight floor on desktop-width viewports
  const REVEAL_RADIUS_MAX = 340;     // px — searchlight size ceiling, on wide desktop viewports
  const REVEAL_RADIUS_VW = 0.18;     // preferred size as a share of the hero's width, like clamp()'s middle arg
  const REVEAL_RADIUS_VW_MOBILE = 0.28; // mobile scales with viewport — avoids the desktop min blowing up the beam
  const REVEAL_RADIUS_MIN_MOBILE = 88;
  const REVEAL_RADIUS_MAX_MOBILE = 200;
  const REVEAL_CORE_FRACTION = 0.14; // share of radius that stays fully opaque before falloff
  const POINTER_EASE = 0.14;         // 0..1, how quickly the glow follows the mouse/finger
  const GROWTH_ON_MOVE = 0.15;       // spotlight grows up to 15% while actively moving (desktop)
  const GROWTH_ON_MOVE_MOBILE = 0.45; // mobile tilt: stronger speed-linked expansion
  const MAX_RADIUS_SCALE_MOBILE = 1.52; // ceiling on mobile beam scale (base + growth)
  const SPEED_FOR_MAX_GROWTH = 35;   // px/move-event needed to hit full growth
  const SPEED_FOR_MAX_GROWTH_MOBILE = 9; // lower bar — tilt deltas are smaller per event
  const GRADIENT_STOPS = 16;         // samples along the spotlight's falloff curve — higher = smoother
  const MOTION_MARGIN = 0.12;        // keep the beam off the viewport edges
  const MOTION_GAMMA_RANGE = 21.5;   // degrees for full horizontal travel (+30% sensitivity vs 28)
  const MOTION_BETA_RANGE = 16.9;    // degrees for full vertical travel (+30% sensitivity vs 22)
  const MOTION_CALIBRATION_SAMPLES = 10; // average first samples so mixed sensor frames do not yank the beam
  const POINTER_EASE_MOTION = 0.2;   // how quickly the beam follows tilt
  const isTouchDevice = matchMedia('(hover: none)').matches; // mobile: centre beam + device tilt
  const isIosDevice = (() => {
    if (typeof navigator === 'undefined') return false;
    const ua = navigator.userAgent || '';
    return /iPad|iPhone|iPod/i.test(ua)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  })();
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let width = 0, height = 0;
  let centerX = 0, centerY = 0;
  let logoLayer = null; // offscreen canvas holding the oversized, static logo mark

  const bgLogoImg = new Image();
  let bgLogoLoaded = false;
  bgLogoImg.onload = () => { bgLogoLoaded = true; buildLogoLayer(); };
  bgLogoImg.src = 'assets/logo.svg';

  // target = raw pointer position, current = eased position the render loop follows
  let targetX = null, targetY = null;
  let currentX = null, currentY = null;
  let pointerActive = false;
  let fadeOut = 0; // 1 = fully visible glow, 0 = pointer has left
  let revealAlpha = 0; // eased reveal strength, follows fadeOut
  let moveSpeed = 0; // decays each frame, spikes on pointer movement
  let radiusScale = 1; // eased 1..1+GROWTH_ON_MOVE, driven by moveSpeed
  let revealRadius = REVEAL_RADIUS_MIN; // clamp(MIN, width * VW, MAX), recalculated on resize
  let motionEnabled = false;
  let motionActivationPending = false;
  let motionCalibrating = false;
  let motionCalibrationBuffer = [];
  let motionBaseline = null; // gamma/beta when calibrated — spotlight rests at screen centre
  let motionGammaFromGravity = null; // iOS often omits gamma on deviceorientation; gravity fills horizontal
  let latestOrientationGamma = null;
  let latestOrientationBeta = null;
  let prevRenderX = null;
  let prevRenderY = null;

  function resize() {
    const rect = hero.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    centerX = width / 2;
    centerY = height / 2;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    revealRadius = computeRevealRadius(width);
    buildLogoLayer();
    if (isTouchDevice && !motionEnabled) {
      initMobileSpotlight();
    }
  }

  function computeRevealRadius(w) {
    if (w < MOBILE_BREAKPOINT) {
      return Math.min(
        REVEAL_RADIUS_MAX_MOBILE,
        Math.max(REVEAL_RADIUS_MIN_MOBILE, w * REVEAL_RADIUS_VW_MOBILE)
      );
    }
    return Math.min(REVEAL_RADIUS_MAX, Math.max(REVEAL_RADIUS_MIN, w * REVEAL_RADIUS_VW));
  }

  function buildLogoLayer() {
    if (!bgLogoLoaded || !width || !height) return;

    logoLayer = document.createElement('canvas');
    logoLayer.width = canvas.width;
    logoLayer.height = canvas.height;
    const lctx = logoLayer.getContext('2d');
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const isMobileLayout = width < MOBILE_BREAKPOINT;
    const logoW = isMobileLayout
      ? Math.min(Math.max(0, width - LOGO_INSET_MOBILE * 2), LOGO_MAX_WIDTH)
      : Math.min(width * LOGO_WIDTH_RATIO, LOGO_MAX_WIDTH);
    const logoH = logoW * (bgLogoImg.naturalHeight / bgLogoImg.naturalWidth);
    lctx.drawImage(bgLogoImg, centerX - logoW / 2, centerY - logoH / 2, logoW, logoH);
  }

  function render() {
    ctx.clearRect(0, 0, width, height);

    const pointerEase = isTouchDevice ? POINTER_EASE_MOTION : POINTER_EASE;

    // ease the glow position toward the pointer for a gentle trailing feel
    if (targetX !== null) {
      if (currentX === null) { currentX = targetX; currentY = targetY; }
      currentX += (targetX - currentX) * pointerEase;
      currentY += (targetY - currentY) * pointerEase;
    }

    // fade the whole glow in/out as the pointer enters/leaves the hero
    const fadeTarget = pointerActive ? 1 : 0;
    fadeOut += (fadeTarget - fadeOut) * 0.09;
    revealAlpha += (fadeOut - revealAlpha) * 0.18;

    const isMobileLayout = width < MOBILE_BREAKPOINT;
    if (isMobileLayout && motionEnabled && currentX !== null && prevRenderX !== null) {
      const frameDx = currentX - prevRenderX;
      const frameDy = currentY - prevRenderY;
      moveSpeed = Math.max(moveSpeed, Math.hypot(frameDx, frameDy));
    }
    if (currentX !== null) {
      prevRenderX = currentX;
      prevRenderY = currentY;
    } else {
      prevRenderX = null;
      prevRenderY = null;
    }

    // grow the spotlight while actively moving, shrink back when it settles
    moveSpeed *= 0.85;
    const growthOnMove = isMobileLayout ? GROWTH_ON_MOVE_MOBILE : GROWTH_ON_MOVE;
    const speedForMaxGrowth = isMobileLayout ? SPEED_FOR_MAX_GROWTH_MOBILE : SPEED_FOR_MAX_GROWTH;
    let growthTarget = 1 + growthOnMove * Math.min(1, moveSpeed / speedForMaxGrowth);
    if (isMobileLayout) {
      growthTarget = Math.min(MAX_RADIUS_SCALE_MOBILE, growthTarget);
    }
    const radiusEase = isMobileLayout ? 0.22 : 0.15;
    radiusScale += (growthTarget - radiusScale) * radiusEase;

    if (currentX !== null && revealAlpha > 0.002 && logoLayer) {
      ctx.save();
      ctx.globalAlpha = MAX_OPACITY * revealAlpha;
      ctx.drawImage(logoLayer, 0, 0, width, height);

      // soft-edged circular spotlight mask
      ctx.globalCompositeOperation = 'destination-in';
      const grad = ctx.createRadialGradient(currentX, currentY, 0, currentX, currentY, revealRadius * radiusScale);
      // sample a smooth cosine falloff (1 -> 0, easing at both ends) instead of a few
      // hand-picked stops, which read as visible rings where the slope kinked
      for (let i = 0; i <= GRADIENT_STOPS; i++) {
        const t = i / GRADIENT_STOPS;
        let alpha;
        if (t <= REVEAL_CORE_FRACTION) {
          alpha = 1;
        } else {
          const u = (t - REVEAL_CORE_FRACTION) / (1 - REVEAL_CORE_FRACTION);
          alpha = 0.5 * (1 + Math.cos(Math.PI * u));
        }
        grad.addColorStop(t, `rgba(255,255,255,${alpha})`);
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);
      ctx.restore();
    }

    requestAnimationFrame(render);
  }

  function updateTarget(newX, newY, opts) {
    const trackSpeed = !opts || opts.trackSpeed !== false;
    if (trackSpeed && targetX !== null) {
      const dx = newX - targetX;
      const dy = newY - targetY;
      moveSpeed = Math.max(moveSpeed, Math.sqrt(dx * dx + dy * dy));
    }
    targetX = newX;
    targetY = newY;
    pointerActive = true;
  }

  function handlePointerMove(e) {
    const rect = hero.getBoundingClientRect();
    updateTarget(e.clientX - rect.left, e.clientY - rect.top);
  }

  function handlePointerLeave() {
    pointerActive = false;
  }

  function isInteractiveTouchTarget(e) {
    const el = e.target instanceof Element ? e.target.closest('a') : null;
    return el !== null && hero.contains(el);
  }

  function showMotionPrompt() {
    if (!motionPrompt || motionEnabled) return;
    motionPrompt.hidden = false;
  }

  function hideMotionPrompt() {
    if (!motionPrompt) return;
    motionPrompt.hidden = true;
  }

  function handleTouchStart(e) {
    if (isTouchDevice && !motionEnabled && motionRequiresUserGesture()) {
      showMotionPrompt();
    }
    if (isInteractiveTouchTarget(e)) return;
  }

  function handleTouchMove(e) {
    if (isInteractiveTouchTarget(e)) return;
    e.preventDefault();
  }

  function handleTouchEnd() {
    if (!isTouchDevice) {
      pointerActive = false;
    }
  }

  function initMobileSpotlight() {
    if (!width || !height) return;
    targetX = centerX;
    targetY = centerY;
    currentX = centerX;
    currentY = centerY;
    pointerActive = true;
    fadeOut = 1;
    revealAlpha = 1;
  }

  function clampSpotlight(x, y) {
    const edgeX = width * MOTION_MARGIN;
    const edgeY = height * MOTION_MARGIN;
    return {
      x: Math.min(width - edgeX, Math.max(edgeX, x)),
      y: Math.min(height - edgeY, Math.max(edgeY, y)),
    };
  }

  function holdSpotlightAtCenter() {
    updateTarget(centerX, centerY, { trackSpeed: false });
  }

  function beginMotionCalibration() {
    motionCalibrating = true;
    motionCalibrationBuffer = [];
    motionBaseline = null;
    motionGammaFromGravity = null;
    latestOrientationGamma = null;
    latestOrientationBeta = null;
    initMobileSpotlight();
  }

  function finishMotionCalibration() {
    if (!motionCalibrationBuffer.length) {
      motionCalibrating = false;
      return;
    }

    let gammaSum = 0;
    let betaSum = 0;
    for (let i = 0; i < motionCalibrationBuffer.length; i++) {
      gammaSum += motionCalibrationBuffer[i].gamma;
      betaSum += motionCalibrationBuffer[i].beta;
    }
    const count = motionCalibrationBuffer.length;
    motionBaseline = { gamma: gammaSum / count, beta: betaSum / count };
    motionCalibrating = false;
    motionCalibrationBuffer = [];
    holdSpotlightAtCenter();
  }

  function applyMotionTilt(gamma, beta) {
    if (!width || !height) return;

    if (motionCalibrating) {
      motionCalibrationBuffer.push({ gamma, beta });
      if (motionCalibrationBuffer.length >= MOTION_CALIBRATION_SAMPLES) {
        finishMotionCalibration();
      }
      holdSpotlightAtCenter();
      return;
    }

    if (motionBaseline === null) {
      motionBaseline = { gamma, beta };
      holdSpotlightAtCenter();
      return;
    }

    const dGamma = gamma - motionBaseline.gamma;
    const dBeta = beta - motionBaseline.beta;
    const maxDx = width * (0.5 - MOTION_MARGIN);
    const maxDy = height * (0.5 - MOTION_MARGIN);
    const rawX = centerX - (dGamma / MOTION_GAMMA_RANGE) * maxDx;
    const rawY = centerY - (dBeta / MOTION_BETA_RANGE) * maxDy;
    const point = clampSpotlight(rawX, rawY);
    updateTarget(point.x, point.y);
  }

  function screenOrientationAngle() {
    if (window.screen && window.screen.orientation && typeof window.screen.orientation.angle === 'number') {
      return window.screen.orientation.angle;
    }
    if (typeof window.orientation === 'number') return window.orientation;
    return 0;
  }

  function tiltFromGravity(x, y, z) {
    let gx = x;
    let gy = y;
    const gz = z;
    const angle = screenOrientationAngle();

    if (angle === 90) {
      const rotatedX = gx;
      gx = -gy;
      gy = rotatedX;
    } else if (angle === -90 || angle === 270) {
      const rotatedX = gx;
      gx = gy;
      gy = -rotatedX;
    } else if (angle === 180) {
      gx = -gx;
      gy = -gy;
    }

    const beta = Math.atan2(-gz, Math.sqrt(gx * gx + gy * gy)) * (180 / Math.PI);
    const gamma = Math.atan2(gx, gy) * (180 / Math.PI);
    return { gamma, beta };
  }

  function resolveMotionGamma(orientationGamma) {
    const gravityGamma = motionGammaFromGravity;
    const hasGravityGamma = gravityGamma != null && !Number.isNaN(gravityGamma);

    if (isIosDevice && hasGravityGamma) {
      if (orientationGamma == null || Number.isNaN(orientationGamma)) {
        return gravityGamma;
      }
      // iOS often reports 0 gamma while the accelerometer still sees roll.
      if (Math.abs(orientationGamma) < 0.01) {
        return gravityGamma;
      }
    }

    if (orientationGamma != null && !Number.isNaN(orientationGamma)) {
      return orientationGamma;
    }
    return hasGravityGamma ? gravityGamma : null;
  }

  function emitMotionTiltFromSensors(orientationGamma, beta) {
    if (beta == null || Number.isNaN(beta)) return;
    const gamma = resolveMotionGamma(orientationGamma);
    if (gamma == null || Number.isNaN(gamma)) return;
    applyMotionTilt(gamma, beta);
  }

  function handleDeviceOrientation(e) {
    if (!motionEnabled) return;
    if (e.beta == null || Number.isNaN(e.beta)) return;
    latestOrientationGamma = e.gamma;
    latestOrientationBeta = e.beta;
    emitMotionTiltFromSensors(e.gamma, e.beta);
  }

  function handleDeviceMotion(e) {
    if (!motionEnabled || !isIosDevice) return;
    const g = e.accelerationIncludingGravity;
    if (!g || g.x == null || g.y == null || g.z == null) return;
    motionGammaFromGravity = tiltFromGravity(g.x, g.y, g.z).gamma;
    if (latestOrientationBeta != null) {
      emitMotionTiltFromSensors(latestOrientationGamma, latestOrientationBeta);
    }
  }

  function resetMotionBaseline() {
    if (!motionEnabled) {
      motionBaseline = null;
      return;
    }
    beginMotionCalibration();
  }

  function motionRequiresUserGesture() {
    if (isIosDevice) return true;
    return (typeof DeviceOrientationEvent !== 'undefined'
      && typeof DeviceOrientationEvent.requestPermission === 'function')
      || (typeof DeviceMotionEvent !== 'undefined'
      && typeof DeviceMotionEvent.requestPermission === 'function');
  }

  async function requestMotionPermissionsFromClick() {
    if (typeof DeviceOrientationEvent !== 'undefined'
      && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const orientationState = await DeviceOrientationEvent.requestPermission();
      if (orientationState !== 'granted') return false;
    } else if (typeof DeviceMotionEvent !== 'undefined'
      && typeof DeviceMotionEvent.requestPermission === 'function') {
      const motionState = await DeviceMotionEvent.requestPermission();
      if (motionState !== 'granted') return false;
    }

    if (typeof DeviceMotionEvent !== 'undefined'
      && typeof DeviceMotionEvent.requestPermission === 'function'
      && typeof DeviceOrientationEvent !== 'undefined'
      && typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        await DeviceMotionEvent.requestPermission();
      } catch (_) {}
    }

    return true;
  }

  function startMotionListeners() {
    window.addEventListener('deviceorientation', handleDeviceOrientation, true);
    if (isIosDevice) {
      window.addEventListener('devicemotion', handleDeviceMotion, true);
    }
    motionEnabled = true;
    beginMotionCalibration();
    hideMotionPrompt();
  }

  async function activateMotionFromUserClick() {
    if (motionEnabled || motionActivationPending) return;
    motionActivationPending = true;
    if (motionPromptBtn) motionPromptBtn.disabled = true;

    try {
      let granted = true;
      if (motionRequiresUserGesture()) {
        granted = await requestMotionPermissionsFromClick();
      }
      if (granted) {
        startMotionListeners();
      } else if (motionPromptBtn) {
        motionPromptBtn.textContent = 'Motion blocked — tap to retry';
        motionPromptBtn.disabled = false;
      }
    } catch (_) {
      if (motionPromptBtn) {
        motionPromptBtn.textContent = 'Motion unavailable — tap to retry';
        motionPromptBtn.disabled = false;
      }
    } finally {
      motionActivationPending = false;
    }
  }

  function enableDeviceMotion() {
    if (motionEnabled || motionActivationPending) return;
    if (motionRequiresUserGesture()) {
      showMotionPrompt();
      return;
    }
    startMotionListeners();
  }

  window.addEventListener('resize', resize);
  hero.addEventListener('mousemove', handlePointerMove);
  hero.addEventListener('mouseleave', handlePointerLeave);
  // touchstart reveals immediately on tap/hold, not just once the finger starts dragging
  hero.addEventListener('touchstart', handleTouchStart, { passive: true });
  if (motionPromptBtn) {
    motionPromptBtn.addEventListener('click', () => {
      void activateMotionFromUserClick();
    });
  }
  window.addEventListener('orientationchange', resetMotionBaseline);
  if (window.screen && window.screen.orientation) {
    window.screen.orientation.addEventListener('change', resetMotionBaseline);
  }
  hero.addEventListener('touchmove', handleTouchMove, { passive: false });
  hero.addEventListener('touchend', handleTouchEnd);
  hero.addEventListener('touchcancel', handleTouchEnd);

  resize();
  requestAnimationFrame(render);
  if (isTouchDevice) {
    initMobileSpotlight();
    if (motionRequiresUserGesture()) {
      showMotionPrompt();
    } else {
      enableDeviceMotion();
    }
  }
})();
</script>

</body>
</html>
